[project]
name = "fight-arena"
version = "0.1.0"
description = "Group fight-prediction game powered by models trained on UFC, sumo, ADCC, powerlifting and fitness data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "joblib==1.5.3",
    "matplotlib==3.10.8",
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "segno==1.6.1",
    "threadpoolctl==3.6.0",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
