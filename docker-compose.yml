# Run on a server:  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"                 # open http://SERVER_IP in a browser; QR codes use that address
    environment:
      ARENA_DB: /app/data/arena.db
      # PUBLIC_URL: https://fight.example.com   # optional: force the address used in QR codes
    volumes:
      - arena-data:/app/data      # rooms survive container rebuilds

volumes:
  arena-data:
